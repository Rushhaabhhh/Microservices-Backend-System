apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/rushhaabhhh/microservices-backend-system/gateway:latest
          ports: [{ name: http, containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: service-config } }]
          env:
            - { name: PORT, value: "4000" }
            - { name: API_SECRET, valueFrom: { secretKeyRef: { name: service-secrets, key: API_SECRET } } }
            - { name: METRICS_PORT, value: "9200" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 15 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ name: http, port: 4000, targetPort: http, nodePort: 30400 }]
