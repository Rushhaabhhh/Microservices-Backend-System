apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
spec:
  replicas: 1
  selector: { matchLabels: { app: users } }
  template:
    metadata: { labels: { app: users } }
    spec:
      containers:
        - name: users
          image: ghcr.io/rushhaabhhh/microservices-backend-system/users:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: service-config } }]
          env:
            - { name: API_SECRET, valueFrom: { secretKeyRef: { name: service-secrets, key: API_SECRET } } }
            - { name: MONGO_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: service-secrets, key: MONGO_ROOT_USERNAME } } }
            - { name: MONGO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: service-secrets, key: MONGO_ROOT_PASSWORD } } }
            - { name: MONGO_URL, valueFrom: { secretKeyRef: { name: service-secrets, key: USERS_MONGO_URL } } }
            - { name: USERS_SERVICE_PORT, value: "8000" }
            - { name: METRICS_PORT, value: "9201" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 384Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: users-service }
spec:
  selector: { app: users }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
