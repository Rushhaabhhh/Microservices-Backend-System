global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['api-gateway:9200']

  - job_name: 'user-service'
    static_configs:
      - targets: ['users-service:9201']

  - job_name: 'product-service'
    static_configs:
      - targets: ['products-service:9202']

  - job_name: 'order-service'
    static_configs:
      - targets: ['orders-service:9203']

  - job_name: 'recommendation-service'
    static_configs:
      - targets: ['recommendations-service:8000']